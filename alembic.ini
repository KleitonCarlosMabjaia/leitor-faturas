# Configuração do Alembic (migrações da base de dados).
# O endereço da base de dados não está aqui: vem de app/config.py (URL_BASE_DADOS / DATABASE_URL).
#
# Criar uma migração depois de alterar app/modelos/tabelas.py:
#   alembic revision --autogenerate -m "descricao da alteracao"
# Aplicar (a aplicação também o faz sozinha ao arrancar):
#   alembic upgrade head

[alembic]
script_location = %(here)s/migracoes
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
