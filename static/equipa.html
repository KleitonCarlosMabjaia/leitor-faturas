<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipa · Leitor de Faturas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="pagina">
    <nav class="menu" aria-label="Principal">
      <a href="/">Faturas</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/equipa" aria-current="page">Equipa</a>
      <span class="conta" id="conta"></span>
    </nav>

    <header class="topo">
      <h1>Equipa</h1>
      <p>Convide colegas para usarem a aplicação. Cada pessoa recebe um link para definir a sua palavra-passe.</p>
    </header>

    <section class="cartao" aria-labelledby="titulo-convidar">
      <h2 id="titulo-convidar">Convidar</h2>
      <form id="convite" class="grelha-convite" novalidate>
        <div class="campo">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" autocomplete="off" required>
        </div>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="off" required>
        </div>
        <div class="campo">
          <label for="papel">Papel</label>
          <select id="papel" name="papel">
            <option value="membro">Membro: carrega e revê faturas</option>
            <option value="admin">Administrador: também gere a equipa</option>
          </select>
        </div>
        <button type="submit" class="botao">Criar convite</button>
      </form>

      <div class="caixa-link" id="caixa-link" hidden>
        <p id="texto-link"></p>
        <div class="linha-link">
          <input id="link" readonly aria-label="Link de convite">
          <button type="button" class="botao secundario" id="copiar">Copiar</button>
        </div>
        <p class="ajuda">Envie-o por um canal privado. É válido durante 72 horas e só pode ser usado uma vez.</p>
      </div>
    </section>

    <p class="mensagem" id="mensagem" role="status" aria-live="polite"></p>

    <section aria-labelledby="titulo-membros" class="lista">
      <div class="lista-cabecalho">
        <h2 id="titulo-membros">Membros</h2>
      </div>
      <table class="tabela">
        <thead>
          <tr>
            <th scope="col">Nome</th>
            <th scope="col">Papel</th>
            <th scope="col">Estado</th>
            <th scope="col"><span class="visualmente-oculto">Ações</span></th>
          </tr>
        </thead>
        <tbody id="membros"></tbody>
      </table>
    </section>
  </main>

  <script src="/static/comum.js"></script>
  <script src="/static/equipa.js"></script>
</body>
</html>
