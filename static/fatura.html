<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rever fatura · Leitor de Faturas</title>
  <script src="/static/tema.js?v=2026-11-11"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=2026-11-11">
</head>
<body data-pagina="faturas">
  <header id="barra"></header>

  <main class="conteudo">
    <a class="voltar" href="/"><span data-icone="seta-esquerda"></span>Todas as faturas</a>

    <header class="cabecalho-fatura">
      <div>
        <div class="titulo-com-etiqueta">
          <h1 id="titulo">A carregar…</h1>
          <span id="etiqueta"></span>
        </div>
        <p class="subtitulo" id="subtitulo"></p>
      </div>
      <a class="botao secundario" id="proxima" hidden>Próxima por rever<span data-icone="seta-direita"></span></a>
    </header>

    <div class="revisao">
      <section class="painel-pdf" aria-labelledby="titulo-pdf">
        <h2 id="titulo-pdf" class="visualmente-oculto">Documento original</h2>
        <div class="painel-pdf-topo">
          <span><span data-icone="ficheiro"></span><span id="nome-pdf">PDF original</span></span>
          <a id="abrir-pdf" target="_blank" rel="noopener">Abrir noutra janela<span data-icone="seta-direita"></span></a>
        </div>
        <iframe id="pdf" title="PDF da fatura"></iframe>
      </section>

      <section class="cartao painel-dados" aria-labelledby="titulo-dados">
        <div class="corpo corpo-topo">
          <div class="linha-topo">
            <h2 id="titulo-dados">Dados da fatura</h2>
            <label class="interruptor" for="paga">
              <input type="checkbox" id="paga" role="switch"> Paga
            </label>
          </div>

          <div class="caixa-alertas" id="alertas" role="note" hidden>
            <span data-icone="alerta"></span>
            <div>
              <strong>A verificar</strong>
              <ul id="lista-alertas"></ul>
            </div>
          </div>
        </div>

        <form id="formulario" novalidate>
          <div class="corpo corpo-campos">
            <h3 class="secao-titulo">Fornecedor</h3>
            <div class="campo">
              <label for="fornecedor">Nome</label>
              <input id="fornecedor" name="fornecedor" autocomplete="organization" required>
            </div>
            <div class="grelha-2">
              <div class="campo">
                <label for="nif_fornecedor">NIF</label>
                <input id="nif_fornecedor" name="nif_fornecedor" inputmode="numeric" maxlength="11" required>
              </div>
              <div class="campo">
                <label for="numero_fatura">Número da fatura</label>
                <input id="numero_fatura" name="numero_fatura" required>
              </div>
            </div>

            <h3 class="secao-titulo">Datas</h3>
            <div class="grelha-2">
              <div class="campo">
                <label for="data_emissao">Emissão</label>
                <input type="date" id="data_emissao" name="data_emissao" required>
              </div>
              <div class="campo">
                <label for="data_vencimento">Vencimento <span class="opcional">(opcional)</span></label>
                <input type="date" id="data_vencimento" name="data_vencimento">
              </div>
            </div>

            <h3 class="secao-titulo">Valores</h3>
            <table class="tabela tabela-iva">
              <caption class="visualmente-oculto">IVA por taxa</caption>
              <thead>
                <tr>
                  <th scope="col">Taxa (%)</th>
                  <th scope="col">Base (€)</th>
                  <th scope="col">IVA (€)</th>
                  <th scope="col"><span class="visualmente-oculto">Remover</span></th>
                </tr>
              </thead>
              <tbody id="linhas-iva"></tbody>
            </table>
            <button type="button" class="botao fantasma pequeno" id="adicionar-iva"><span data-icone="mais"></span>Adicionar taxa de IVA</button>

            <div class="grelha-2 valores">
              <div class="campo">
                <label for="valor_sem_iva">Valor sem IVA (€)</label>
                <input type="number" step="0.01" inputmode="decimal" id="valor_sem_iva" name="valor_sem_iva" required>
              </div>
              <div class="campo">
                <label for="total">Total (€)</label>
                <input type="number" step="0.01" inputmode="decimal" id="total" name="total" required>
              </div>
            </div>
            <input type="hidden" id="moeda" name="moeda" value="EUR">

            <p class="conferencia" id="conferencia" aria-live="polite"></p>
          </div>

          <div class="barra-guardar">
            <span class="estado-gravacao" id="estado-gravacao" aria-live="polite">Sem alterações</span>
            <button type="button" class="botao secundario" id="guardar">Guardar</button>
            <button type="submit" class="botao" id="confirmar"><span data-icone="check"></span>Confirmar dados</button>
            <div class="atalhos" aria-hidden="true">
              <span><kbd>Ctrl</kbd> + <kbd>S</kbd> guardar</span>
              <span><kbd>Ctrl</kbd> + <kbd>Enter</kbd> confirmar</span>
            </div>
          </div>
        </form>
      </section>
    </div>
  </main>

  <template id="modelo-linha-iva">
    <tr>
      <td><input type="number" step="0.01" inputmode="decimal" class="taxa" aria-label="Taxa de IVA em percentagem"></td>
      <td><input type="number" step="0.01" inputmode="decimal" class="base" aria-label="Base tributável"></td>
      <td><input type="number" step="0.01" inputmode="decimal" class="valor" aria-label="Valor do IVA"></td>
      <td class="remover-celula"></td>
    </tr>
  </template>

  <script src="/static/comum.js?v=2026-11-11"></script>
  <script src="/static/fatura.js?v=2026-11-11"></script>
</body>
</html>
